# Dependency updates: one grouped pull request per week.
#
# Only `github-actions` is configured, and it matters: the workflows pin every action to a
# commit SHA with the version in a trailing comment, and Dependabot is one of the few tools
# that understands that convention well enough to keep the pins current.
#
# The `bun` ecosystem is deliberately absent. Its first run failed in the updater
# (`update_files`) on this repository, and a permanently red Dependabot run teaches people
# to ignore the real ones. The one runtime dependency, @clack/prompts, is updated by hand
# (`bun update`). Revisit when Dependabot's Bun support catches up with Bun 1.4's lockfile.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
