# Dependency updates: one grouped pull request per ecosystem per week.
#
# Grouped on purpose. Ungrouped, every bump is its own pull request and reviewers learn
# to ignore them, which is worse than no automation. Major versions stay out of the
# groups — each needs a human to read a changelog.
#
# `github-actions` matters more than usual here: the workflows pin every action to a
# commit SHA with the version in a trailing comment, and Dependabot is one of the few
# tools that understands that convention well enough to keep the pins current.
version: 2

updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      bun:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
