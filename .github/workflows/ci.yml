name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing in CI needs to write to the repository.
permissions:
  contents: read

jobs:
  # Development runs on Bun: tests, typecheck, and the lockfile.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

  # What users run is the built package under real Node, installed the ways users install
  # it, with no Bun involved at runtime. Each step below is one of those ways; if it
  # breaks here it is broken for them.
  node-compat:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Bun installs from the lockfile and, through `prepare`, builds dist/ once.
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: The package holds only what it should
        run: |
          npm pack --dry-run --json | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const files = JSON.parse(s)[0].files;
              const bad = files.filter((f) => /^(src|test|\.github|node_modules)\//.test(f.path));
              if (bad.length) { console.error("unexpected files:", bad.map((f) => f.path)); process.exit(1); }
              const cli = files.find((f) => f.path === "dist/cli.js");
              if (!cli || !(cli.mode & 0o111)) { console.error("dist/cli.js is missing or not executable"); process.exit(1); }
              console.log(files.length + " files, dist/cli.js executable");
            });'

      - name: Install the packed tarball, as npm would from the registry
        run: |
          set -euo pipefail
          npm pack --silent
          npm install -g --prefix "$RUNNER_TEMP/from-tarball" ./ccprovider-*.tgz
          bin="$RUNNER_TEMP/from-tarball/bin/ccprovider"
          test "$("$bin" --version)" = "$(node -p 'require("./package.json").version')"
          export HOME="$RUNNER_TEMP/home-tarball"; mkdir -p "$HOME"
          "$bin" --help > /dev/null
          "$bin" ls
          "$bin" doctor

  # A user's clone runs `npm install`, which ignores bun.lock and takes the newest
  # dependencies that match package.json. Do exactly that, so an upstream release that
  # breaks the build (@clack/prompts 1.8 did) fails here first, not in an issue.
  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: npm install builds dist/ through `prepare`
        run: npm install --no-package-lock
      - name: The clone runs
        run: |
          set -euo pipefail
          test "$(node dist/cli.js --version)" = "$(node -p 'require("./package.json").version')"
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          node dist/cli.js --help > /dev/null
          node dist/cli.js ls
          node dist/cli.js doctor
