name: Release

# A release is a tag. Pushing `vX.Y.Z` tests the package, attests where the tarball came
# from, publishes it as a GitHub release, and — only when an NPM_TOKEN secret exists —
# publishes the very same tarball to npm. Without the secret it stops at GitHub, and the
# tarball there is installable by URL (see the README).
#
# Guards:
#   - the tag must equal package.json's version, so what `ccprovider --version` prints is
#     what the release page says;
#   - the tagged commit must be on main, so a tag pushed on an unreviewed branch cannot ship;
#   - a tag with a hyphen (v0.2.0-rc.1) is a pre-release on GitHub and goes to npm under the
#     `next` dist-tag, so `npm install ccprovider` never resolves to it.
#
# Also worth setting in the repository: a tag ruleset restricting who can create `v*`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the attestation, and npm provenance
      attestations: write  # store it
    env:
      # Job-level so a step's `if` can ask whether it is set; the value is never printed.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # needed to ask whether the tag is on main
          persist-credentials: false # the write token is only handed to the steps that need it
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile

      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - run: bun test
      - run: bun run typecheck

      - name: Pack, and prove the tarball installs and runs under Node without Bun
        run: |
          set -euo pipefail
          npm pack --silent
          npm install -g --prefix "$RUNNER_TEMP/smoke" ./ccprovider-*.tgz
          test "$("$RUNNER_TEMP/smoke/bin/ccprovider" --version)" = "$(node -p 'require("./package.json").version')"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ccprovider-*.tgz

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" ccprovider-*.tgz --generate-notes --verify-tag $pre

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish ./ccprovider-*.tgz --provenance --access public --tag "$tag"

      - name: Say what was skipped
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set, so this release is on GitHub only. Add the secret and re-run this workflow to publish the same tarball to npm."
